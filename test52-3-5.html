<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 5下社會科 期末考複習系統</title>
<style>
  :root {
    --bg: #f0f4ff;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-light: #555577;
    --border: #dde3f5;
    --primary: #5b6ef5;
    --primary-light: #e8ebff;
    --danger: #ff4f6e;
    --danger-light: #fff0f3;
    --success: #22c55e;
    --success-light: #e8fff0;
    --warning: #f59e0b;
    --warning-light: #fffbeb;
    --accent1: #8b5cf6;
    --accent2: #06b6d4;
    --accent3: #f97316;
    --shadow: 0 2px 12px rgba(91,110,245,0.10);
    --shadow-lg: 0 8px 32px rgba(91,110,245,0.18);
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    --answered-bg: #e8f5ff;
    --answered-border: #93c5fd;
    --flagged-border: #f59e0b;
    --flagged-bg: #fffbeb;
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --card-bg: #1a1d2e;
    --text: #e8eaf6;
    --text-light: #9999bb;
    --border: #2a2d42;
    --primary: #7c8dff;
    --primary-light: #1f2340;
    --danger: #ff6b85;
    --danger-light: #2a1520;
    --success: #4ade80;
    --success-light: #0d2018;
    --warning: #fbbf24;
    --warning-light: #1a1400;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
    --answered-bg: #1a2535;
    --answered-border: #3b5ea6;
    --flagged-bg: #1a1400;
    --flagged-border: #d97706;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ── TOP HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent1) 100%);
    color: white;
    padding: 18px 24px 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(91,110,245,0.25);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.03em; }
  .header h1 span { opacity: 0.75; font-size: 0.8rem; display: block; font-weight: 400; margin-top: 2px; }
  .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .hbtn {
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: white; border-radius: 20px; padding: 6px 14px;
    font-size: 0.82rem; cursor: pointer; font-weight: 600;
    transition: all 0.2s; white-space: nowrap;
  }
  .hbtn:hover { background: rgba(255,255,255,0.32); }
  .hbtn.active { background: white; color: var(--primary); border-color: white; }

  /* ── STATS BAR ── */
  .stats-bar {
    background: var(--card-bg);
    border-bottom: 1.5px solid var(--border);
    padding: 10px 24px;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    font-size: 0.82rem;
  }
  .stat-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--primary-light); color: var(--primary);
    padding: 4px 12px; border-radius: 20px; font-weight: 600;
  }
  .stat-chip.flag { background: var(--warning-light); color: var(--warning); }
  .stat-chip.correct { background: var(--success-light); color: var(--success); }
  .stat-chip.wrong { background: var(--danger-light); color: var(--danger); }
  .progress-bar-wrap {
    flex: 1; min-width: 120px; max-width: 220px;
    height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent1));
    border-radius: 4px; transition: width 0.4s;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    padding: 12px 24px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--card-bg);
    border-bottom: 1.5px solid var(--border);
  }
  .search-wrap {
    position: relative; flex: 1; min-width: 200px;
  }
  .search-wrap input {
    width: 100%; padding: 9px 14px 9px 38px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
    font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--primary); }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 1rem; pointer-events: none; opacity: 0.5;
  }
  .filter-tabs { display: flex; gap: 6px; }
  .filter-tab {
    padding: 7px 16px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text-light);
    font-size: 0.83rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .filter-tab.active {
    background: var(--primary); color: white; border-color: var(--primary);
  }
  .mode-select {
    padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 0.83rem; outline: none; cursor: pointer;
    font-weight: 600;
  }
  .type-filter-wrap { display: flex; gap: 6px; }
  .type-btn {
    padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text-light);
    font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .type-btn.active { background: var(--accent2); color: white; border-color: var(--accent2); }

  /* ── QUIZ MODE BANNER ── */
  .quiz-banner {
    background: linear-gradient(90deg, var(--accent3), var(--danger));
    color: white; text-align: center; padding: 10px;
    font-weight: 700; font-size: 0.9rem; display: none;
  }
  .quiz-banner.visible { display: block; }

  /* ── QUESTIONS CONTAINER ── */
  .questions-list { padding: 16px 24px; max-width: 960px; margin: 0 auto; }
  .no-results {
    text-align: center; padding: 60px 20px;
    color: var(--text-light); font-size: 1rem;
  }
  .no-results .icon { font-size: 3rem; display: block; margin-bottom: 12px; }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    overflow: hidden;
  }
  .q-card:hover { box-shadow: var(--shadow-lg); }
  .q-card.flagged {
    border-color: var(--flagged-border);
    background: var(--flagged-bg);
  }
  .q-card.answered-correct { border-color: var(--success); }
  .q-card.answered-wrong { border-color: var(--danger); }

  .q-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
  }

  /* Flag button */
  .flag-btn {
    flex-shrink: 0; width: 34px; height: 34px;
    background: none; border: 2px solid var(--border);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: all 0.2s; margin-top: 2px;
  }
  .flag-btn:hover { border-color: var(--warning); background: var(--warning-light); }
  .flag-btn.flagged { background: var(--warning); border-color: var(--warning); }
  .flagged-label {
    display: none; font-size: 0.68rem; font-weight: 700;
    color: var(--warning); background: var(--warning-light);
    padding: 2px 7px; border-radius: 6px; margin-top: 4px; text-align: center;
  }
  .q-card.flagged .flagged-label { display: block; }
  .flag-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }

  /* Q number */
  .q-num {
    flex-shrink: 0; width: 32px; height: 32px;
    background: var(--primary-light); color: var(--primary);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.82rem; margin-top: 3px;
  }

  /* Type badge */
  .q-type-badge {
    flex-shrink: 0; font-size: 0.7rem; font-weight: 700;
    padding: 3px 8px; border-radius: 6px; margin-top: 5px;
    white-space: nowrap;
  }
  .q-type-badge.tf { background: var(--accent2); color: white; }
  .q-type-badge.mc { background: var(--accent1); color: white; }

  /* Q content */
  .q-content { flex: 1; min-width: 0; }
  .q-source {
    font-size: 0.7rem; color: var(--text-light);
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 0.95rem; line-height: 1.7;
    color: var(--text); margin-bottom: 10px;
  }

  /* Options grid */
  .options-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px; margin-bottom: 10px;
  }
  @media (max-width: 600px) {
    .options-grid { grid-template-columns: 1fr; }
  }
  .opt-btn {
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text);
    cursor: pointer; text-align: left;
    font-size: 0.88rem; font-weight: 500;
    transition: all 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .opt-btn:hover { border-color: var(--primary); background: var(--primary-light); }
  .opt-btn.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 700; }
  .opt-btn.correct-opt { border-color: var(--success); background: var(--success-light); color: var(--success); font-weight: 700; }
  .opt-btn.wrong-opt { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
  .opt-label {
    min-width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); display: flex; align-items: center;
    justify-content: center; font-size: 0.75rem; font-weight: 700;
    flex-shrink: 0;
  }

  /* Answer area */
  .answer-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg);
    border-top: 1.5px dashed var(--border);
    cursor: pointer;
  }
  .answer-label {
    font-size: 0.78rem; font-weight: 700;
    color: var(--text-light); white-space: nowrap;
  }
  .answer-text {
    flex: 1;
    font-size: 0.9rem; font-weight: 700;
    color: white; /* hidden: same as hover bg */
    background: white;
    border-radius: 6px; padding: 4px 10px;
    transition: color 0.2s, background 0.2s;
    border: 1.5px solid var(--border);
    min-height: 30px; display: flex; align-items: center;
  }
  [data-theme="dark"] .answer-text {
    color: var(--card-bg); background: var(--card-bg);
    border-color: var(--border);
  }
  .answer-row:hover .answer-text,
  .answer-text.revealed {
    color: var(--primary) !important;
    background: var(--primary-light) !important;
  }
  [data-theme="dark"] .answer-row:hover .answer-text,
  [data-theme="dark"] .answer-text.revealed {
    color: var(--primary) !important;
    background: var(--primary-light) !important;
  }
  .reveal-hint {
    font-size: 0.72rem; color: var(--text-light);
    white-space: nowrap; opacity: 0.7;
  }

  /* Explanation */
  .explanation {
    padding: 8px 16px 12px;
    font-size: 0.82rem; color: var(--text-light);
    background: var(--bg); border-top: 1px solid var(--border);
    line-height: 1.6; display: none;
  }
  .explanation.visible { display: block; }
  .explanation strong { color: var(--accent3); }

  /* Quiz mode answer feedback */
  .quiz-feedback {
    display: none; padding: 10px 16px;
    font-size: 0.9rem; font-weight: 700;
    border-top: 2px solid var(--border);
    align-items: center; gap: 8px;
  }
  .quiz-feedback.visible { display: flex; }
  .quiz-feedback.correct { background: var(--success-light); color: var(--success); border-color: var(--success); }
  .quiz-feedback.wrong { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }

  /* ── BOTTOM ACTION BAR ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card-bg);
    border-top: 2px solid var(--border);
    padding: 12px 24px;
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    z-index: 90; box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .action-btn {
    padding: 10px 22px; border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 0.88rem; font-weight: 700; cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); }
  .action-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .action-btn.primary:hover { background: var(--accent1); border-color: var(--accent1); }
  .action-btn.danger { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }

  /* Bottom padding for fixed bar */
  .questions-list { padding-bottom: 80px; }

  /* ── SECTION DIVIDER ── */
  .section-divider {
    text-align: center; margin: 20px 0 12px;
    font-size: 0.88rem; font-weight: 700; color: var(--text-light);
    display: flex; align-items: center; gap: 10px;
  }
  .section-divider::before,
  .section-divider::after {
    content: ''; flex: 1; height: 1.5px; background: var(--border);
  }

  /* ── MOBILE TWEAKS ── */
  @media (max-width: 768px) {
    .header { padding: 14px 16px; }
    .stats-bar, .toolbar, .questions-list { padding-left: 12px; padding-right: 12px; }
    .q-row { gap: 8px; padding: 12px 12px; }
    .header h1 { font-size: 1rem; }
    .hbtn { padding: 5px 10px; font-size: 0.75rem; }
  }

  /* ── ANIMATIONS ── */
  @keyframes pop { 0%{transform:scale(0.9)} 60%{transform:scale(1.1)} 100%{transform:scale(1)} }
  .flag-btn.flagged { animation: pop 0.3s ease; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body data-theme="light">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <h1>🎓 5下社會科 期末考複習系統
        <span>翰林版 第3-5單元 ｜ 北投國小</span>
      </h1>
    </div>
    <div class="header-btns">
      <button class="hbtn" onclick="toggleTheme()" id="theme-btn">🌙 深色</button>
      <button class="hbtn" id="mode-btn" onclick="cycleMode()">📝 測驗模式</button>
      <button class="hbtn" onclick="scrollTop()">⬆ 回頂部</button>
    </div>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat-chip">📚 <span id="stat-total">0</span> 題</div>
  <div class="stat-chip flag">🚩 已標記 <span id="stat-flagged">0</span> 題 (<span id="stat-flag-pct">0</span>%)</div>
  <div class="stat-chip correct" id="stat-correct-chip" style="display:none">✅ 答對 <span id="stat-correct">0</span></div>
  <div class="stat-chip wrong" id="stat-wrong-chip" style="display:none">❌ 答錯 <span id="stat-wrong">0</span></div>
  <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <span id="stat-progress-txt" style="font-size:0.8rem;color:var(--text-light);display:none"></span>
</div>

<!-- QUIZ BANNER -->
<div class="quiz-banner" id="quiz-banner">
  📝 測驗模式中 — 選擇答案後查看結果，完成後點「查看成績」
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜尋題目關鍵字…" oninput="filterQuestions()">
  </div>
  <div class="filter-tabs">
    <button class="filter-tab active" id="tab-all" onclick="setFilter('all')">全部題目</button>
    <button class="filter-tab" id="tab-flagged" onclick="setFilter('flagged')">🚩 已標記</button>
    <button class="filter-tab" id="tab-wrong" onclick="setFilter('wrong')">❌ 錯題本</button>
  </div>
  <div class="type-filter-wrap">
    <button class="type-btn active" id="type-all" onclick="setType('all')">全部</button>
    <button class="type-btn" id="type-tf" onclick="setType('tf')">是非</button>
    <button class="type-btn" id="type-mc" onclick="setType('mc')">選擇</button>
  </div>
</div>

<!-- QUESTIONS -->
<div class="questions-list" id="questions-list"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="action-btn" onclick="revealAll()">👁 顯示所有答案</button>
  <button class="action-btn" onclick="hideAll()">🙈 隱藏所有答案</button>
  <button class="action-btn danger" onclick="clearFlags()">🗑 清除所有旗標</button>
  <button class="action-btn primary" id="score-btn" onclick="showScore()" style="display:none">📊 查看成績</button>
  <button class="action-btn" onclick="resetQuiz()" id="reset-btn" style="display:none">🔄 重新作答</button>
</div>

let flags = JSON.parse(localStorage.getItem('social_flags') || '{}');
let userAnswers = {};     // id -> selected option text
let quizSubmitted = {};   // id -> bool
let mode = 'review';      // 'review' | 'quiz'
let filterMode = 'all';   // 'all' | 'flagged' | 'wrong'
let typeFilter = 'all';   // 'all' | 'tf' | 'mc'
let revealed = {};        // id -> bool (answer revealed in review mode)

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderAll();
  updateStats();
});

// ══════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════
function getFilteredQuestions() {
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  return QUESTIONS.filter(q => {
    if (typeFilter !== 'all' && q.type !== typeFilter) return false;
    if (filterMode === 'flagged' && !flags[q.id]) return false;
    if (filterMode === 'wrong') {
      if (!quizSubmitted[q.id]) return false;
      if (userAnswers[q.id] === q.answer) return false;
    }
    if (search) {
      const haystack = q.question + (q.options||[]).join(' ') + q.answer + (q.explanation||'');
      if (!haystack.toLowerCase().includes(search)) return false;
    }
    return true;
  });
}

function renderAll() {
  const list = document.getElementById('questions-list');
  const filtered = getFilteredQuestions();
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results"><span class="icon">🔎</span>沒有符合條件的題目</div>';
    document.getElementById('stat-total').textContent = 0;
    return;
  }
  
  document.getElementById('stat-total').textContent = filtered.length;
  
  let html = '';
  let lastSection = '';
  filtered.forEach((q, idx) => {
    const section = q.section || (q.type === 'tf' ? '是非題' : '選擇題');
    if (section !== lastSection) {
      html += `<div class="section-divider">${section === '是非題' ? '✅ 是非題' : '🔵 選擇題'}</div>`;
      lastSection = section;
    }
    html += renderCard(q, idx + 1);
  });
  list.innerHTML = html;
}

function renderCard(q, displayNum) {
  const isFlagged = !!flags[q.id];
  const isAnswered = quizSubmitted[q.id];
  const isCorrect = isAnswered && userAnswers[q.id] === q.answer;
  const isWrong   = isAnswered && userAnswers[q.id] !== q.answer;
  const isRevealed = !!revealed[q.id];
  
  let cardClass = 'q-card';
  if (isFlagged) cardClass += ' flagged';
  if (isCorrect) cardClass += ' answered-correct';
  if (isWrong)   cardClass += ' answered-wrong';
  
  const typeBadge = q.type === 'tf'
    ? '<span class="q-type-badge tf">是非</span>'
    : '<span class="q-type-badge mc">選擇</span>';
  
  // Options HTML
  let optionsHtml = '';
  if (q.type === 'mc' && q.options && q.options.length > 0) {
    const labels = ['Ａ','Ｂ','Ｃ','Ｄ','Ｅ'];
    optionsHtml = '<div class="options-grid">';
    q.options.forEach((opt, i) => {
      let cls = 'opt-btn';
      if (mode === 'quiz') {
        if (!isAnswered) {
          if (userAnswers[q.id] === opt) cls += ' selected';
          cls += '" onclick="selectOption(' + q.id + ', \`' + escJs(opt) + '\`)"';
        } else {
          if (opt === q.answer) cls += ' correct-opt';
          else if (userAnswers[q.id] === opt && opt !== q.answer) cls += ' wrong-opt';
          cls += '"';
        }
      } else {
        cls += '"';
      }
      optionsHtml += `<button class="${cls}"><span class="opt-label">${labels[i]||i+1}</span>${escHtml(opt)}</button>`;
    });
    optionsHtml += '</div>';
  } else if (q.type === 'tf') {
    // TF options in review mode
    const opts = ['○ 正確', '╳ 錯誤'];
    optionsHtml = '<div class="options-grid">';
    opts.forEach((opt) => {
      let cls = 'opt-btn';
      if (mode === 'quiz') {
        if (!isAnswered) {
          if (userAnswers[q.id] === opt) cls += ' selected';
          cls += '" onclick="selectOption(' + q.id + ', \`' + escJs(opt) + '\`)"';
        } else {
          if (opt === q.answer) cls += ' correct-opt';
          else if (userAnswers[q.id] === opt && opt !== q.answer) cls += ' wrong-opt';
          cls += '"';
        }
      } else {
        cls += '"';
      }
      optionsHtml += `<button class="${cls}">${escHtml(opt)}</button>`;
    });
    optionsHtml += '</div>';
  }
  
  // Answer row (hidden in quiz mode until submitted)
  let answerHtml = '';
  if (mode === 'review') {
    const revClass = isRevealed ? 'revealed' : '';
    answerHtml = `
      <div class="answer-row" onclick="toggleReveal(${q.id})" title="點擊或懸停查看答案">
        <span class="answer-label">📋 答案</span>
        <span class="answer-text ${revClass}" id="ans-${q.id}">${escHtml(q.answer)}</span>
        <span class="reveal-hint">👆 點擊 / 懸停顯示</span>
      </div>`;
  } else if (mode === 'quiz' && isAnswered) {
    const feedbackClass = isCorrect ? 'correct' : 'wrong';
    const icon = isCorrect ? '✅' : '❌';
    const msg = isCorrect ? '答對了！' : `答案是：${q.answer}`;
    answerHtml = `<div class="quiz-feedback ${feedbackClass} visible">${icon} ${escHtml(msg)}</div>`;
  }
  
  // Explanation
  let explainHtml = '';
  if (q.explanation) {
    explainHtml = `<div class="explanation ${isRevealed || (mode==='quiz'&&isAnswered) ? 'visible' : ''}" id="exp-${q.id}">
      💡 <strong>解析：</strong>${escHtml(q.explanation)}
    </div>`;
  }
  
  // Source badge
  const srcHtml = `<div class="q-source">📂 ${escHtml(q.source || '')}</div>`;
  
  return `
  <div class="${cardClass}" id="card-${q.id}">
    <div class="q-row">
      <div class="flag-col">
        <button class="flag-btn ${isFlagged?'flagged':''}" onclick="toggleFlag(${q.id})" title="標記為容易出錯">
          ${isFlagged ? '🚩' : '⚑'}
        </button>
        <span class="flagged-label">弱點</span>
      </div>
      <div class="q-num">${displayNum}</div>
      ${typeBadge}
      <div class="q-content">
        ${srcHtml}
        <div class="q-text">${escHtml(q.question)}</div>
        ${optionsHtml}
      </div>
    </div>
    ${answerHtml}
    ${explainHtml}
  </div>`;
}

// ══════════════════════════════════════════════════════
//  INTERACTIONS
// ══════════════════════════════════════════════════════
function toggleFlag(id) {
  if (flags[id]) delete flags[id];
  else flags[id] = true;
  localStorage.setItem('social_flags', JSON.stringify(flags));
  updateStats();
  
  // Re-render just this card
  const q = QUESTIONS.find(q => q.id === id);
  if (!q) return;
  const filtered = getFilteredQuestions();
  const idx = filtered.findIndex(qq => qq.id === id);
  
  if (filterMode === 'flagged' && !flags[id]) {
    // Card should disappear
    renderAll();
    return;
  }
  
  const card = document.getElementById('card-' + id);
  if (card && idx >= 0) {
    card.outerHTML = renderCard(q, idx + 1);
  }
}

function toggleReveal(id) {
  revealed[id] = !revealed[id];
  const ansEl = document.getElementById('ans-' + id);
  const expEl = document.getElementById('exp-' + id);
  if (ansEl) ansEl.classList.toggle('revealed', revealed[id]);
  if (expEl) expEl.classList.toggle('visible', revealed[id]);
}

function selectOption(id, opt) {
  if (mode !== 'quiz') return;
  if (quizSubmitted[id]) return;
  userAnswers[id] = opt;
  quizSubmitted[id] = true;
  updateStats();
  
  const q = QUESTIONS.find(q => q.id === id);
  if (!q) return;
  const filtered = getFilteredQuestions();
  const idx = filtered.findIndex(qq => qq.id === id);
  const card = document.getElementById('card-' + id);
  if (card && idx >= 0) {
    card.outerHTML = renderCard(q, idx + 1);
  }
}

function revealAll() {
  getFilteredQuestions().forEach(q => { revealed[q.id] = true; });
  renderAll();
}

function hideAll() {
  getFilteredQuestions().forEach(q => { delete revealed[q.id]; });
  renderAll();
}

function clearFlags() {
  if (!confirm('確定要清除所有旗標嗎？')) return;
  flags = {};
  localStorage.setItem('social_flags', JSON.stringify(flags));
  updateStats();
  renderAll();
}

function filterQuestions() { renderAll(); updateStats(); }

function setFilter(f) {
  filterMode = f;
  ['all','flagged','wrong'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===f);
  });
  renderAll(); updateStats();
}

function setType(t) {
  typeFilter = t;
  ['all','tf','mc'].forEach(tt => {
    document.getElementById('type-'+tt).classList.toggle('active', tt===t);
  });
  renderAll(); updateStats();
}

// ══════════════════════════════════════════════════════
//  MODE CYCLING
// ══════════════════════════════════════════════════════
function cycleMode() {
  if (mode === 'review') {
    mode = 'quiz';
    document.getElementById('mode-btn').textContent = '📖 複習模式';
    document.getElementById('mode-btn').classList.add('active');
    document.getElementById('quiz-banner').classList.add('visible');
    document.getElementById('score-btn').style.display = '';
    document.getElementById('reset-btn').style.display = '';
    document.getElementById('stat-correct-chip').style.display = '';
    document.getElementById('stat-wrong-chip').style.display = '';
    document.getElementById('progress-wrap').style.display = '';
    document.getElementById('stat-progress-txt').style.display = '';
  } else {
    mode = 'review';
    document.getElementById('mode-btn').textContent = '📝 測驗模式';
    document.getElementById('mode-btn').classList.remove('active');
    document.getElementById('quiz-banner').classList.remove('visible');
    document.getElementById('score-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    document.getElementById('stat-correct-chip').style.display = 'none';
    document.getElementById('stat-wrong-chip').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('stat-progress-txt').style.display = 'none';
  }
  renderAll(); updateStats();
}

function resetQuiz() {
  if (!confirm('確定要清除所有作答紀錄嗎？')) return;
  userAnswers = {}; quizSubmitted = {};
  renderAll(); updateStats();
}

function showScore() {
  const filtered = getFilteredQuestions();
  const answered = filtered.filter(q => quizSubmitted[q.id]);
  const correct  = answered.filter(q => userAnswers[q.id] === q.answer);
  const pct = answered.length ? Math.round(correct.length / answered.length * 100) : 0;
  const msg = `📊 成績報告\n\n作答：${answered.length} / ${filtered.length} 題\n答對：${correct.length} 題\n答錯：${answered.length - correct.length} 題\n正確率：${pct}%\n\n${pct >= 80 ? '🎉 太棒了！' : pct >= 60 ? '👍 加油繼續！' : '💪 多練習哦！'}`;
  alert(msg);
}

// ══════════════════════════════════════════════════════
//  STATS
// ══════════════════════════════════════════════════════
function updateStats() {
  const total = QUESTIONS.length;
  const flagCount = Object.keys(flags).length;
  document.getElementById('stat-flagged').textContent = flagCount;
  document.getElementById('stat-flag-pct').textContent = Math.round(flagCount / total * 100);
  document.getElementById('stat-total').textContent = getFilteredQuestions().length;
  
  if (mode === 'quiz') {
    const filtered = getFilteredQuestions();
    const answered = filtered.filter(q => quizSubmitted[q.id]);
    const correct  = answered.filter(q => userAnswers[q.id] === q.answer);
    const wrong    = answered.length - correct.length;
    document.getElementById('stat-correct').textContent = correct.length;
    document.getElementById('stat-wrong').textContent = wrong;
    const pct = filtered.length ? Math.round(answered.length / filtered.length * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('stat-progress-txt').textContent = `已答 ${answered.length}/${filtered.length}`;
  }
}

// ══════════════════════════════════════════════════════
//  THEME
// ══════════════════════════════════════════════════════
function toggleTheme() {
  const body = document.body;
  const isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '🌙 深色' : '☀️ 淺色';
  localStorage.setItem('social_theme', isDark ? 'light' : 'dark');
}
// Restore theme
(function() {
  const saved = localStorage.getItem('social_theme');
  if (saved === 'dark') {
    document.body.setAttribute('data-theme', 'dark');
    setTimeout(() => {
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = '☀️ 淺色';
    }, 0);
  }
})();

// ══════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════
function scrollTop() { window.scrollTo({top:0, behavior:'smooth'}); }

function escHtml(s) {
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function escJs(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/`/g,'\\`');
}
</script>
